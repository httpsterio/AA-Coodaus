name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          VERSION=${{ github.ref_name }}

          GOOS=linux   GOARCH=amd64 go build -o aac ./
          tar -czf aac-${VERSION}-linux-amd64.tar.gz aac
          rm aac

          GOOS=darwin  GOARCH=amd64 go build -o aac ./
          tar -czf aac-${VERSION}-macos-intel.tar.gz aac
          rm aac

          GOOS=darwin  GOARCH=arm64 go build -o aac ./
          tar -czf aac-${VERSION}-macos-arm64.tar.gz aac
          rm aac

          GOOS=windows GOARCH=amd64 go build -o aac.exe ./
          zip aac-${VERSION}-windows-amd64.zip aac.exe
          rm aac.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aac-${{ github.ref_name }}-linux-amd64.tar.gz
            aac-${{ github.ref_name }}-macos-intel.tar.gz
            aac-${{ github.ref_name }}-macos-arm64.tar.gz
            aac-${{ github.ref_name }}-windows-amd64.zip